[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvsl-offline-tracking"
version = "0.1.0"
description = "Independent offline fly detection and recording diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nvsl-offline = "nvsl_offline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
